name: Gerar APK Topaz Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Baixar Topaz Mobile Offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "TopazMobile_Offline.zip" \
            --dir /tmp

          rm -rf project
          mkdir project
          unzip -q /tmp/TopazMobile_Offline.zip -d project

          echo "Arquivos encontrados:"
          find project -maxdepth 4 -type f | head -100

      - name: Encontrar projeto Android
        run: |
          PROJECT=$(find project -name settings.gradle.kts -print -quit | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Verificar modelo IA
        run: |
          find "$PROJECT" -name "Real-ESRGAN-x4plus.onnx" -ls

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Gerar APK
        working-directory: ${{ env.PROJECT }}
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: TopazMobile-Offline
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
