name: Gerar APK Topaz Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Baixar projeto offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf project
          mkdir project

          gh release download V1.3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "TopazMobile_Offline.zip" \
            --dir /tmp \
            --clobber

          unzip -q /tmp/TopazMobile_Offline.zip -d project

          if [ -d project/TopazMobileFinal ]; then
            shopt -s dotglob
            mv project/TopazMobileFinal/* project/
            rmdir project/TopazMobileFinal
          fi

          echo "Projeto encontrado:"
          find project -maxdepth 3 -type f | head -100

      - name: Encontrar projeto Android
        run: |
          PROJECT=$(find project -name settings.gradle.kts -print -quit | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "Projeto Android não encontrado."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto: $PROJECT"

      - name: Verificar modelo IA
        run: |
          MODEL=$(find "$PROJECT" -name "Real-ESRGAN-x4plus.onnx" -print -quit)

          if [ -z "$MODEL" ]; then
            echo "Modelo Real-ESRGAN não encontrado."
            exit 1
          fi

          ls -lh "$MODEL"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar licenças e instalar SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Gerar APK
        working-directory: ${{ env.PROJECT }}
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: TopazMobile-Offline
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
