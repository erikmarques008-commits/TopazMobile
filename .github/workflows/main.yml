name: Gerar APK do Topaz Mobile Offline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Baixar projeto da Release v1.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf project
          mkdir project

          gh release download v1.3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "TopazMobile_Offline.zip" \
            --dir /tmp \
            --clobber

          unzip -q /tmp/TopazMobile_Offline.zip -d project

          if [ -d project/TopazMobileFinal ]; then
            shopt -s dotglob
            mv project/TopazMobileFinal/* project/
            rmdir project/TopazMobileFinal
          fi

          test -f project/settings.gradle.kts
          test -f project/app/src/main/assets/Real-ESRGAN-x4plus.onnx

          ls -lh project/app/src/main/assets/Real-ESRGAN-x4plus.onnx

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TopazMobile-Offline-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
