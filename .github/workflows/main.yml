name: Build Topaz Mobile APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Baixar Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          chmod +x gradle-8.11.1/bin/gradle

      - name: Preparar projeto
        run: |
          rm -rf temp
          unzip -q TopazMobile_Corrigido_Final.zip -d temp
          cp -r temp/TopazMobileFinal/. .
          rm -rf temp

      - name: Compilar APK
        run: |
          ./gradle-8.11.1/bin/gradle :app:assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: TopazMobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
